name: Sync from Upstream

env:
  UPSTREAM_REPO: capawesome-team/capacitor-firebase
  DEFAULT_UPSTREAM_BRANCH: main
  UPSTREAM_MARKER_FILE: .github/upstream-sync.json

on:
  schedule:
    # Run every day at 9 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Upstream branch to sync from'
        required: false
        default: 'main'
      dry_run:
        description: 'Only evaluate the marker skip decision (no branch, PR, or issue)'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: "Sync changes from upstream repository"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: '${{ secrets.PERSONAL_ACCESS_TOKEN }}'

      - name: Configure Git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        env:
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch upstream

      - name: Evaluate upstream sync decision
        id: evaluate
        env:
          UPSTREAM_BRANCH: ${{ github.event.inputs.branch || env.DEFAULT_UPSTREAM_BRANCH }}
          UPSTREAM_MARKER_FILE: ${{ env.UPSTREAM_MARKER_FILE }}
        run: |
          set -euo pipefail
          git fetch upstream "$UPSTREAM_BRANCH"
          UPSTREAM_COMMIT="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"

          node .github/scripts/upstream-sync-decision.mjs evaluate \
            --upstream-sha "$UPSTREAM_COMMIT" \
            --marker-file "$UPSTREAM_MARKER_FILE"

          SHOULD_SYNC="$(grep -E '^should_sync=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"
          SYNC_REASON="$(grep -E '^sync_reason=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"

          echo "has_changes=$SHOULD_SYNC" >> "$GITHUB_OUTPUT"

          if ! grep -q '^upstream_commit=' "$GITHUB_OUTPUT"; then
            echo "upstream_commit=$UPSTREAM_COMMIT" >> "$GITHUB_OUTPUT"
          fi

          echo "Dry-run style evaluation: should_sync=${SHOULD_SYNC} reason=${SYNC_REASON} upstream=${UPSTREAM_COMMIT}"

      - name: Dry run summary
        if: github.event.inputs.dry_run == 'true'
        env:
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ github.event.inputs.branch || env.DEFAULT_UPSTREAM_BRANCH }}
        run: |
          {
            echo "## Upstream sync dry run"
            echo
            echo "- Upstream: \`${UPSTREAM_REPO}\` branch \`${UPSTREAM_BRANCH}\`"
            echo "- Upstream commit: \`${{ steps.evaluate.outputs.upstream_commit }}\`"
            echo "- Last integrated (marker): \`${{ steps.evaluate.outputs.last_integrated_upstream_sha }}\`"
            echo "- Should sync: \`${{ steps.evaluate.outputs.should_sync }}\`"
            echo "- Reason: \`${{ steps.evaluate.outputs.sync_reason }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip when upstream already integrated
        if: steps.evaluate.outputs.should_sync != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          echo "Skipping sync. Upstream commit matches .github/upstream-sync.json (${{ steps.evaluate.outputs.sync_reason }})."

      - name: Skip when an open sync PR already targets this upstream commit
        id: open_sync_pr
        if: steps.evaluate.outputs.should_sync == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          UPSTREAM_COMMIT: ${{ steps.evaluate.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          source .github/scripts/sync-gh-helpers.sh
          EXISTING_PR="$(find_open_sync_pr_for_upstream_sha "${GITHUB_REPOSITORY}" "$UPSTREAM_COMMIT" || true)"
          if [ -n "$EXISTING_PR" ]; then
            echo "skip_open_sync_pr=true" >> "$GITHUB_OUTPUT"
            echo "existing_pr_number=$EXISTING_PR" >> "$GITHUB_OUTPUT"
            echo "Skipping sync. Open upstream-sync PR #${EXISTING_PR} already covers upstream ${UPSTREAM_COMMIT}."
            exit 0
          fi
          echo "skip_open_sync_pr=false" >> "$GITHUB_OUTPUT"

      - name: Create sync branch
        if: steps.evaluate.outputs.should_sync == 'true' && github.event.inputs.dry_run != 'true' && steps.open_sync_pr.outputs.skip_open_sync_pr != 'true'
        run: |
          BRANCH_NAME="sync-upstream-$(date +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME

      - name: Ensure sync labels exist
        if: steps.evaluate.outputs.should_sync == 'true' && github.event.inputs.dry_run != 'true' && steps.open_sync_pr.outputs.skip_open_sync_pr != 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          source .github/scripts/sync-gh-helpers.sh
          ensure_sync_labels "${GITHUB_REPOSITORY}"

      - name: Merge upstream changes
        if: steps.evaluate.outputs.should_sync == 'true' && github.event.inputs.dry_run != 'true' && steps.open_sync_pr.outputs.skip_open_sync_pr != 'true'
        id: merge
        env:
          UPSTREAM_BRANCH: ${{ github.event.inputs.branch || env.DEFAULT_UPSTREAM_BRANCH }}
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
        run: |
          set -euo pipefail

          MERGE_MESSAGE="chore: sync from upstream ${UPSTREAM_REPO}"

          if git merge "upstream/$UPSTREAM_BRANCH" --no-edit -m "$MERGE_MESSAGE"; then
            echo "merge_status=success" >> $GITHUB_OUTPUT
            echo "resolution_mode=clean" >> $GITHUB_OUTPUT
            echo "✅ Merge successful"
            exit 0
          fi

          if ! git diff --name-only --diff-filter=U | grep -q .; then
            echo "Merge failed without unresolved conflicts"
            exit 1
          fi

          echo "⚠️ Merge conflicts detected"
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          echo "conflicts<<EOF" >> $GITHUB_OUTPUT
          echo "$CONFLICTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          git merge --abort
          echo "merge_status=conflict" >> $GITHUB_OUTPUT
          echo "resolution_mode=manual" >> $GITHUB_OUTPUT

      - name: Record integrated upstream marker
        if: steps.evaluate.outputs.should_sync == 'true' && github.event.inputs.dry_run != 'true' && steps.open_sync_pr.outputs.skip_open_sync_pr != 'true' && steps.merge.outputs.merge_status == 'success'
        env:
          UPSTREAM_COMMIT: ${{ steps.evaluate.outputs.upstream_commit }}
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ github.event.inputs.branch || env.DEFAULT_UPSTREAM_BRANCH }}
          UPSTREAM_MARKER_FILE: ${{ env.UPSTREAM_MARKER_FILE }}
        run: |
          set -euo pipefail
          node .github/scripts/upstream-sync-decision.mjs write-marker \
            --upstream-sha "$UPSTREAM_COMMIT" \
            --marker-file "$UPSTREAM_MARKER_FILE" \
            --upstream-repo "$UPSTREAM_REPO" \
            --upstream-branch "$UPSTREAM_BRANCH"
          git add "$UPSTREAM_MARKER_FILE"
          git commit -m "chore: record integrated upstream ${UPSTREAM_COMMIT}"

      - name: Push sync branch
        if: steps.evaluate.outputs.should_sync == 'true' && github.event.inputs.dry_run != 'true' && steps.open_sync_pr.outputs.skip_open_sync_pr != 'true' && steps.merge.outputs.merge_status == 'success'
        env:
          GH_PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          BRANCH_NAME: ${{ env.branch_name }}
        run: |
          set -euo pipefail
          remote_repo="https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote_repo" "$BRANCH_NAME"

      - name: Create Pull Request
        if: steps.evaluate.outputs.should_sync == 'true' && github.event.inputs.dry_run != 'true' && steps.open_sync_pr.outputs.skip_open_sync_pr != 'true' && steps.merge.outputs.merge_status == 'success'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          BRANCH_NAME: ${{ env.branch_name }}
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ github.event.inputs.branch || env.DEFAULT_UPSTREAM_BRANCH }}
          UPSTREAM_COMMIT: ${{ steps.evaluate.outputs.upstream_commit }}
        run: |
          set -euo pipefail

          source .github/scripts/sync-gh-helpers.sh

          RESOLUTION_NOTES=$(cat <<'EOF_NOTES'
          ### Conflict Resolution
          - No merge conflicts were detected
          EOF_NOTES
          )

          PR_BODY=$(cat <<EOF
          ## 🔄 Upstream Sync

          This PR syncs changes from the upstream repository [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}).

          ### Changes Included
          - Latest commits from upstream \`${UPSTREAM_BRANCH}\` branch
          - Upstream commit: \`${UPSTREAM_COMMIT}\`
          - Updates \`.github/upstream-sync.json\` so squash merges still advance the integrated upstream marker

          ${RESOLUTION_NOTES}

          ### Automated Process
          - ✅ Tests will run automatically
          - ✅ Auto-merge is enabled once checks pass
          - 🤖 Generated by GitHub Actions

          ---
          *Created by the upstream sync workflow*
          EOF
          )

          PR_NUMBER="$(create_pr_and_capture_number "${GITHUB_REPOSITORY}" "main" "$BRANCH_NAME" "chore: sync from upstream ${UPSTREAM_REPO}" "$PR_BODY" || true)"

          if [ -z "$PR_NUMBER" ]; then
            {
              echo "## ⚠️ Pull request creation needs manual follow-up"
              echo
              echo "The sync branch \`$BRANCH_NAME\` was pushed successfully, but the workflow could not create or find a pull request."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          add_labels_to_pr "${GITHUB_REPOSITORY}" "$PR_NUMBER" upstream-sync automated || true
          echo "pull_request_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.evaluate.outputs.should_sync == 'true' && github.event.inputs.dry_run != 'true' && steps.open_sync_pr.outputs.skip_open_sync_pr != 'true' && steps.merge.outputs.merge_status == 'success' && steps.create_pr.outputs.pull_request_number
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull_request_number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash || {
            echo "Auto-merge could not be enabled for PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

      - name: Report unresolved conflicts
        if: steps.evaluate.outputs.should_sync == 'true' && github.event.inputs.dry_run != 'true' && steps.open_sync_pr.outputs.skip_open_sync_pr != 'true' && steps.merge.outputs.merge_status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ github.event.inputs.branch || env.DEFAULT_UPSTREAM_BRANCH }}
          UPSTREAM_COMMIT: ${{ steps.evaluate.outputs.upstream_commit }}
          BRANCH_NAME: ${{ env.branch_name }}
          MERGE_CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          set -euo pipefail

          source .github/scripts/sync-gh-helpers.sh
          ensure_sync_labels "${GITHUB_REPOSITORY}"

          ISSUE_BODY=$(cat <<EOF_BODY
          ## ⚠️ Upstream sync needs manual conflict resolution

          An automatic sync from [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}) encountered merge conflicts.

          ### Conflicting Files
          \`\`\`
          ${MERGE_CONFLICTS}
          \`\`\`

          ### Automatic Merge Result
          - Git could not merge the upstream changes automatically, so no sync branch was pushed.

          ### Sync Details
          - Upstream branch: \`${UPSTREAM_BRANCH}\`
          - Upstream commit: \`${UPSTREAM_COMMIT}\`
          - Attempted branch name: \`${BRANCH_NAME}\`

          ### Action Required
          1. Check out \`main\` locally
          2. Merge the upstream commit
          3. Resolve the listed conflicts and open a PR
          4. Set \`lastIntegratedUpstreamSha\` in \`.github/upstream-sync.json\` to the integrated upstream commit
          EOF_BODY
          )

          ISSUE_NUMBER="$(create_or_update_conflict_issue "${GITHUB_REPOSITORY}" "⚠️ Upstream sync requires manual conflict resolution" "$ISSUE_BODY" "$UPSTREAM_COMMIT" || true)"

          if [ -n "$ISSUE_NUMBER" ]; then
            echo "Created or updated issue #$ISSUE_NUMBER"
            exit 0
          fi

          {
            echo "## ⚠️ Upstream sync needs manual conflict resolution"
            echo
            echo "The workflow could not open an issue automatically. Details are below."
            echo
            echo "$ISSUE_BODY"
          } >> "$GITHUB_STEP_SUMMARY"