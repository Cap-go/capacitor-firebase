name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - renovate/**
      - v9
  pull_request:
    branches: [ main, v9 ]
  workflow_call:

env:
  NODE_VERSION: 24
  JAVA_VERSION: 21
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  guard_swiftpm_version:
    # Allow up to 45 minutes for full monorepo iOS builds after upstream sync.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6
      - name: Enforce Capacitor 9 SwiftPM dependency
        run: |
          set -euo pipefail
          # Capacitor 9: plugins depend on ionic-team/capacitor.git 9.x, capacitor-swift-pm is gone.
          files=$(git ls-files 'Package.swift' '*/Package.swift' | grep -v -E '(^|/)example-app/' || true)
          if [ -z "$files" ]; then
            echo "No Package.swift found"
            exit 1
          fi
          for f in $files; do
            if grep -q 'capacitor-swift-pm' "$f"; then
              echo "$f still depends on capacitor-swift-pm (Capacitor 8)"
              exit 1
            fi
            if ! grep -Eq 'https://github.com/ionic-team/capacitor\.git"[[:space:]]*,[[:space:]]*from:[[:space:]]*"9\.' "$f"; then
              echo "Expected ionic-team/capacitor.git from 9.x in $f"
              exit 1
            fi
          done
  test-android:
    # Allow up to 45 minutes for full monorepo iOS builds after upstream sync.
    timeout-minutes: 10
    name: Test Android platform
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install dependencies
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Build packages affected by changes
        run: bun run affected:verify:android

  test-ios:
    # Allow up to 45 minutes for full monorepo iOS builds after upstream sync.
    timeout-minutes: 45
    name: Test iOS platform
    runs-on: macos-15
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Install dependencies
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Cache SwiftPM and DerivedData (Capacitor 9 builds from source)
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            build/ios-derived
          key: ${{ runner.os }}-cap9-ios-${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.podspec', '!**/node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-cap9-ios-
      - name: Install CocoaPods dependencies of packages affected by changes
        run: bun run affected:ios:pod:install
      - name: Install SPM dependencies of packages affected by changes
        run: bun run affected:ios:spm:install
      - name: Build packages affected by changes
        run: bun run affected:verify:ios

  test-web:
    # Allow up to 45 minutes for full monorepo iOS builds after upstream sync.
    timeout-minutes: 10
    name: Test Web platform
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Build packages affected by changes
        run: bun run affected:verify:web

  lint:
    # Allow up to 45 minutes for full monorepo iOS builds after upstream sync.
    timeout-minutes: 10
    name: Lint
    runs-on: macos-15
    needs: [test-android, test-ios, test-web]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Lint packages affected by changes
        run: bun run affected:lint
