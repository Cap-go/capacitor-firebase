name: Build and publish

concurrency:
  group: build-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "*/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (example: analytics/v8.3.1)"
        required: true
        type: string

jobs:
  # Tests already passed before tag was created, so just build and deploy
  deploy:
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: "Build and publish to npm"
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Refuse tags outside the Capacitor 9 beta line
        run: |
          set -euo pipefail
          REF_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION="${REF_NAME##*/}"
          VERSION="${VERSION#v}"
          case "$VERSION" in
            9.0.0-beta.*) echo "Publishing $REF_NAME to npm beta" ;;
            *) echo "Refusing to publish $REF_NAME from v9: only 9.0.0-beta.* tags are allowed"; exit 1 ;;
          esac
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - name: Extract package name from tag
        id: extract
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            EXPECTED_REF="refs/tags/$TAG"
            if [ "$WORKFLOW_REF" != "$EXPECTED_REF" ]; then
              echo "Refusing branch dispatch: start the run at the tag ref."
              echo "Example: gh workflow run build.yml --ref \"$TAG\" -f tag=\"$TAG\""
              exit 1
            fi
            TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}")"
            if [ "$(git rev-parse HEAD)" != "$TAG_COMMIT" ]; then
              echo "HEAD does not match tag commit for $TAG"
              exit 1
            fi
          else
            TAG="$REF_NAME"
          fi

          if ! [[ "$TAG" =~ ^[a-z-]+/v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Missing tag refs/tags/$TAG"
            exit 1
          fi

          PACKAGE_NAME="$(echo "$TAG" | sed 's|/.*||')"
          if [ ! -d "packages/$PACKAGE_NAME" ]; then
            echo "No packages/$PACKAGE_NAME for tag $TAG"
            exit 1
          fi

          {
            echo "release_tag=$TAG"
            echo "package_name=$PACKAGE_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing package: $PACKAGE_NAME at $TAG"
      - name: Install dependencies
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Build package
        env:
          PACKAGE_NAME: ${{ steps.extract.outputs.package_name }}
        run: |
          set -euo pipefail
          cd "packages/$PACKAGE_NAME"
          bun run build
      - name: Generate changelog
        id: changelog
        env:
          CURRENT_TAG: ${{ steps.extract.outputs.release_tag }}
          PKG: ${{ steps.extract.outputs.package_name }}
        run: |
          set -euo pipefail

          # Find the previous tag for this package (same tag namespace), excluding the current tag.
          PREV_TAG="$(git tag --list "$PKG/v*" --sort=-v:refname | grep -Fxv "$CURRENT_TAG" | head -n 1 || true)"

          if [ -z "$PREV_TAG" ]; then
            # First release in the new tag namespace; just show recent commits touching this package.
            CHANGELOG="$(git log -n 20 --pretty=format:'- %s (%h)' "$CURRENT_TAG" -- "packages/$PKG" || true)"
            FIRST_PKG_COMMIT="$(git log --reverse --format=%H "$CURRENT_TAG" -- "packages/$PKG" | head -n 1 || true)"
            if [ -n "$FIRST_PKG_COMMIT" ]; then
              PREV_TAG="$(git rev-parse "${FIRST_PKG_COMMIT}^" 2>/dev/null || echo "$FIRST_PKG_COMMIT")"
            else
              PREV_TAG="$(git rev-parse "${CURRENT_TAG}^" 2>/dev/null || echo "$CURRENT_TAG")"
            fi
          else
            CHANGELOG="$(git log --pretty=format:'- %s (%h)' "$PREV_TAG..$CURRENT_TAG" -- "packages/$PKG" || true)"
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="(no changes detected)"
          fi

          {
            echo "from_tag=$PREV_TAG"
            echo "to_tag=$CURRENT_TAG"
            echo "result<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm CLI for staged publishing
        run: npm install -g npm@^11.15.0
      - name: Stage publish to npm
        if: ${{ !contains(steps.extract.outputs.release_tag, '-alpha.') && !contains(steps.extract.outputs.release_tag, '-beta.') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.extract.outputs.package_name }}
        run: |
          set -euo pipefail
          cd "packages/$PACKAGE_NAME"
          npm --version
          npm stage publish --provenance --access public --ignore-scripts
      - name: Stage publish to npm (alpha)
        if: ${{ contains(steps.extract.outputs.release_tag, '-alpha.') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.extract.outputs.package_name }}
        run: |
          set -euo pipefail
          cd "packages/$PACKAGE_NAME"
          npm --version
          npm stage publish --tag next --provenance --access public --ignore-scripts
      - name: Stage publish to npm with beta tag
        if: ${{ contains(steps.extract.outputs.release_tag, '-beta.') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.extract.outputs.package_name }}
        run: |
          set -euo pipefail
          cd "packages/$PACKAGE_NAME"
          npm --version
          npm stage publish --tag beta --provenance --access public --ignore-scripts
      - name: Request stage approval
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.NPM_STAGE_DISPATCH_TOKEN }}
          PACKAGE_NAME: ${{ steps.extract.outputs.package_name }}
        run: |
          set -euo pipefail
          NPM_PACKAGE_NAME="$(node -p "require('./packages/$PACKAGE_NAME/package.json').name")"
          gh api --method POST repos/Cap-go/automations/dispatches \
            -f event_type=npm-stage-approve \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[run_id]=${GITHUB_RUN_ID}" \
            -f "client_payload[package]=${NPM_PACKAGE_NAME}"
      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.extract.outputs.release_tag }}
          body: |
            ## 🆕 Changelog

            ${{ steps.changelog.outputs.result }}

            ---

            🔗 **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.changelog.outputs.from_tag }}...${{ steps.changelog.outputs.to_tag }}
          make_latest: false
          token: '${{ secrets.PERSONAL_ACCESS_TOKEN }}'
          prerelease: true