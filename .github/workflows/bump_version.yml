name: Bump version

on:
  push:
    branches:
      - main
      - development
      - v9
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  # Run all tests first before creating any tags
  test:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    # Called workflow jobs are capped at 10 minutes; never raise that unless explicitly asked.
    uses: ./.github/workflows/test.yml

  # Only bump version and create tag if all tests pass
  bump-version:
    needs: [test]
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    name: "Bump version and create tags"
    permissions:
      contents: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          token: '${{ secrets.PERSONAL_ACCESS_TOKEN }}'
      - name: Snapshot tags before bump
        run: |
          git tag -l | sort > "$RUNNER_TEMP/tags-before.txt"
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun i
      - name: Git config
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
      - name: Get changed packages
        if: github.ref != 'refs/heads/v9'
        id: changed
        run: |
          # Get list of changed packages
          CHANGED_PACKAGES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^packages/' | cut -d'/' -f2 | sort -u | tr '\n' ' ')
          echo "packages=$CHANGED_PACKAGES" >> $GITHUB_OUTPUT
          echo "Changed packages: $CHANGED_PACKAGES"
      - name: Bump versions and create tags
        if: github.ref != 'refs/heads/v9'
        id: bump
        run: |
          set -euo pipefail
          NEW_TAGS=()
          for pkg in ${{ steps.changed.outputs.packages }}; do
            if [ -d "packages/$pkg" ]; then
              cd "packages/$pkg"

              # Update documentation
              bun run docgen || true

              # Keep README changes (docgen output) in a separate commit, so releases remain clean.
              git add README.md || true
              git commit -m "docs: update documentation for $pkg" || true

              CURRENT_VERSION="$(node -p "require('./package.json').version")"
              CURRENT_MAJOR="${CURRENT_VERSION%%.*}"

              args=(
                --skip.changelog
                --skip.tag
                --releaseCommitMessageFormat "chore(release): $pkg {{currentTag}}"
                --tag-prefix "$pkg/v"
                --path .
              )
              if [ "${{ github.ref }}" != "refs/heads/main" ]; then
                args=(--prerelease alpha "${args[@]}")
              fi

              # Keep plugin major aligned with Capacitor major:
              # never allow CI to bump from 8.x -> 9.x just because it sees old `feat!` history
              # or because it can't find previous tags for this tag namespace yet.
              DRY_OUT="$(bunx capacitor-plugin-standard-version@latest "${args[@]}" --dry-run 2>&1 || true)"
              NEXT_VERSION="$(printf '%s\n' "$DRY_OUT" | sed -n 's/.*bumping version in .* from [^ ]* to \([^ ]*\).*/\1/p' | tail -n 1)"

              release_as=()
              if [ -n "$NEXT_VERSION" ]; then
                NEXT_MAJOR="${NEXT_VERSION%%.*}"
                if [ "$NEXT_MAJOR" != "$CURRENT_MAJOR" ]; then
                  # Smallest bump that still creates a tag and avoids a major.
                  release_as=(--release-as patch)
                fi
              else
                # If we can't parse the next version from dry-run output, force a patch bump so the
                # tool always has something to commit and will never produce a major.
                release_as=(--release-as patch)
              fi

              bunx capacitor-plugin-standard-version@latest "${args[@]}" "${release_as[@]}"

              # Create the actual tag ourselves to avoid collisions between packages (both would otherwise tag "8.0.2").
              NEW_VERSION="$(node -p "require('./package.json').version")"
              TAG_NAME="$pkg/v$NEW_VERSION"
              if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
                git tag -a "$TAG_NAME" -m "chore(release): $pkg $NEW_VERSION"
                NEW_TAGS+=("$TAG_NAME")
              fi

              cd ../..
            fi
          done

          {
            echo "new_tags<<EOF"
            if [ "${#NEW_TAGS[@]}" -gt 0 ]; then
              printf '%s\n' "${NEW_TAGS[@]}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Bump versions and create tags (v9)
        id: bump_v9
        if: github.ref == 'refs/heads/v9'
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          CHANGED=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" | grep '^packages/' | cut -d'/' -f2 | sort -u || true)
          fi
          # Every package still below 9.x gets its first 9.0.0-beta.0 too, even when this push did not
          # touch it. Otherwise a cancelled or failed first bump leaves those packages on 8.x forever.
          BEHIND=""
          for dir in packages/*/; do
            [ -f "${dir}package.json" ] || continue
            major="$(node -p "require('./${dir}package.json').version.split('.')[0]")"
            if [ "$major" -lt 9 ]; then
              BEHIND="$BEHIND $(basename "$dir")"
            fi
          done
          PKGS=$(printf '%s\n' $CHANGED $BEHIND | sed '/^$/d' | sort -u)
          echo "Packages: $PKGS"
          : > "$RUNNER_TEMP/v9-new-tags.txt"
          for pkg in $PKGS; do
            [ -f "packages/$pkg/package.json" ] || continue
            (
              cd "packages/$pkg"
              bun run docgen || true
              git add README.md || true
              git commit -m "docs: update documentation for $pkg" || true
              CURRENT_MAJOR="$(node -p "require('./package.json').version.split('.')[0]")"
              args=(
                --skip.changelog
                --skip.tag
                --releaseCommitMessageFormat "chore(release): $pkg {{currentTag}}"
                --tag-prefix "$pkg/v"
                --path .
                --prerelease beta
              )
              if [ "$CURRENT_MAJOR" -lt 9 ]; then
                args+=(--release-as 9.0.0)
              fi
              bunx capacitor-plugin-standard-version@2.0.19 "${args[@]}"
              NEW_VERSION="$(node -p "require('./package.json').version")"
              case "$NEW_VERSION" in
                9.0.0-beta.*) ;;
                *) echo "Refusing to tag $pkg $NEW_VERSION on v9: only 9.0.0-beta.* is allowed"; exit 1 ;;
              esac
              TAG_NAME="$pkg/v$NEW_VERSION"
              if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
                git tag -a "$TAG_NAME" -m "chore(release): $pkg $NEW_VERSION"
                echo "$TAG_NAME" >> "$RUNNER_TEMP/v9-new-tags.txt"
              fi
            )
          done
          {
            echo "new_tags<<EOF"
            cat "$RUNNER_TEMP/v9-new-tags.txt"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Push branch to origin
        env:
          GH_PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          GIT_REMOTE="https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git pull "$GIT_REMOTE" "$CURRENT_BRANCH"
          git push "$GIT_REMOTE" "HEAD:$CURRENT_BRANCH"
      - name: Push release tags
        env:
          NEW_TAGS: ${{ steps.bump.outputs.new_tags || steps.bump_v9.outputs.new_tags }}
          GH_PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          GIT_REMOTE="https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          mapfile -t tags < <(printf '%s\n' "$NEW_TAGS" | sed '/^$/d')
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No new tags to push"
            exit 0
          fi
          failed_tags=()
          for tag in "${tags[@]}"; do
            echo "Pushing tag: $tag"
            if ! git push "$GIT_REMOTE" "$tag"; then
              failed_tags+=("$tag")
            fi
          done
          if [ "${#failed_tags[@]}" -gt 0 ]; then
            {
              echo "## Tag push failures"
              echo
              for tag in "${failed_tags[@]}"; do
                tag_sha="$(git rev-list -n1 "$tag")"
                echo "- \`$tag\` (commit \`$tag_sha\`)"
                echo "  \`git tag -a $tag $tag_sha -m \"$tag\" && git push origin $tag\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
